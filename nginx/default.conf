upstream frontend {
    server next:3000;
}

upstream backend {
    server fastapi:8000;
}

upstream bentoml {
    server bentoml-service:3000;
}

server {
    listen 80;
    server_name rootpredict.com www.rootpredict.com;

    # Route root to Next.js frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route /api/ to FastAPI backend
    location /api/ {
        # rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend/api/;
        proxy_set_header Host $host; # Critical: Forward the public domain
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; # Forward HTTP/HTTPS scheme
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_domain backend rootpredict.com; # Rewrite cookie domain
        proxy_pass_header Access-Control-Allow-Origin;
    }

    # Route /ml/ to BentoML service
    location /ml/ {
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass http://bentoml;
    }
}
