services:
  frontend:
    build: ./frontend
    container_name: next
    hostname: next
    ports:
      - "3010:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://fastapi:8000
      - NEXTAUTH_URL=http://localhost:3010
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - fastapi
    restart: unless-stopped

  fastapi:
    build: ./backend
    container_name: fastapi
    environment:
      - STAGE=development
      - PYTHONUNBUFFERED=1
      - BENTOML_HOST=http://bentoml-service:3000/
    ports:
      - "8000:8000"
    networks:
      - mynetwork
    depends_on:
      - bentoml-service
    restart: unless-stopped

  bentoml-service:
    build:
      context: ./backend/bentoml
      dockerfile: Dockerfile
    ports:
      - "5010:3000"
    hostname: bentoml-service
    container_name: bentoml-service
    env_file:
      - ./backend/bentoml/.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./html:/usr/share/nginx/html
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - certbot
    env_file:
      - .env
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    networks:
      - mynetwork
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    env_file:
      - .env
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
networks:
  mynetwork:
    driver: bridge
